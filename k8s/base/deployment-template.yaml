apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-template
  namespace: gamingzone
  labels:
    app: service-template
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-template
  template:
    metadata:
      labels:
        app: service-template
        version: v1
    spec:
      serviceAccountName: gamingzone-sa
      containers:
        - name: service-container
          image: service-image:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
            - containerPort: 5000
              name: grpc
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: NODE_ENV
          envFrom:
            - configMapRef:
                name: services-config
            - secretRef:
                name: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-template-service
  namespace: gamingzone
  labels:
    app: service-template
spec:
  type: ClusterIP
  selector:
    app: service-template
  ports:
    - name: http
      port: 4000
      targetPort: 4000
    - name: grpc
      port: 5000
      targetPort: 5000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: service-template-hpa
  namespace: gamingzone
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: service-template
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
