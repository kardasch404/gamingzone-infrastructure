apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: gamingzone-gateway
  namespace: gamingzone
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: gamingzone-tls
      hosts:
        - "*.gamingzone.com"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway-vs
  namespace: gamingzone
spec:
  hosts:
    - "api.gamingzone.com"
  gateways:
    - gamingzone-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: api-gateway-service
            port:
              number: 4000
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: gamingzone-destination
  namespace: gamingzone
spec:
  host: "*.gamingzone.svc.cluster.local"
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
