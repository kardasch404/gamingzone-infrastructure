apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: gamingzone
data:
  POSTGRES_DB: gamingzone
  POSTGRES_PORT: "5432"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: gamingzone
data:
  REDIS_PORT: "6379"
  REDIS_HOST: redis-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: gamingzone
data:
  KAFKA_BROKER: kafka-service:9092
  KAFKA_ZOOKEEPER: zookeeper-service:2181
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  namespace: gamingzone
data:
  ELASTICSEARCH_NODE: http://elasticsearch-service:9200
  ES_JAVA_OPTS: "-Xms512m -Xmx512m"
