apiVersion: v1
kind: ServiceAccount
metadata:
  name: gamingzone-sa
  namespace: gamingzone
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gamingzone-role
  namespace: gamingzone
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gamingzone-rolebinding
  namespace: gamingzone
subjects:
  - kind: ServiceAccount
    name: gamingzone-sa
    namespace: gamingzone
roleRef:
  kind: Role
  name: gamingzone-role
  apiGroup: rbac.authorization.k8s.io
